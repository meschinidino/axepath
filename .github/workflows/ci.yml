# Axe Path CI: test suites + macOS player on every push and PR.
#
# Needs repo secrets (Settings > Secrets > Actions) or the Unity jobs
# fail at license activation:
#   UNITY_EMAIL     Unity ID email (Personal seat is fine)
#   UNITY_PASSWORD  Unity ID password
# game-ci checks out a Personal seat per run; Unity no longer offers
# offline .ulf activation for Personal, so there is no license file.
#
# Runbook for exit code 137 ("Killed") in the Unity jobs: something SIGKILLs
# the editor seconds after launch, mid-assembly-reload, before it compiles a
# single script. Incidents look like several 137s across jobs/VMs with
# identical trees going green on rerun — never a code problem. Remedy: rerun
# failed jobs; if the flare-up persists, wait it out.
# NOTE (2026-10-23 incident): host dmesg showed no OOM-killer lines and free
# reported GBs available seconds after a kill, so this is NOT host memory
# exhaustion. Cleared since: container limits (game-ci passes no --memory),
# game-ci kill logic (none in CLI source). Open: systemd-oomd (see its log
# in the diagnostics output), platform governance. Update this note when
# the killer is identified.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The test runner publishes results as check runs; without checks:write
# the jobs fail after green suites ("Resource not accessible").
permissions:
  contents: read
  checks: write

jobs:
  unity-version:
    name: Read Unity version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(grep '^m_EditorVersion:' ProjectSettings/ProjectVersion.txt | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.testMode }})
    runs-on: ubuntu-24.04
    needs: unity-version
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ needs.unity-version.outputs.version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ needs.unity-version.outputs.version }}-
      # Same OOM flake net as the build: shared runners SIGKILL (137)
      # the compile spike on a bad day. Attempt 2 runs only if 1 fails;
      # genuine failures fail twice and loudly below.
      - uses: game-ci/unity-test-runner@v4
        id: tests1
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.unity-version.outputs.version }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: test-results/${{ matrix.testMode }}
          checkName: ${{ matrix.testMode }} Test Results
      - uses: game-ci/unity-test-runner@v4
        id: tests2
        if: steps.tests1.outcome == 'failure'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.unity-version.outputs.version }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: test-results/${{ matrix.testMode }}
          checkName: ${{ matrix.testMode }} Test Results
      # Evidence for the next 137 incident (see runbook above). Every probe is
      # guarded so diagnostics can never fail the job on their own, but probe
      # *failures* stay visible (2>&1): "no OOM lines" must mean a clean log,
      # not a broken probe. pipefail lets the (no match) markers fire.
      # The failure() arm is load-bearing, not redundant: an if: without a
      # status-check function is implicitly ANDed with success(), so after a
      # hard attempt failure this step would be skipped without it. (That
      # same gate is why the old "Fail the job..." steps always showed as
      # skipped — they could never run, so they are gone.)
      # No docker-inspect probe: game-ci removes containers (--rm), so there
      # is nothing to inspect, and cgroup OOMs would show in dmesg anyway.
      - name: Capture OOM diagnostics on failure
        if: failure() || steps.tests1.outcome == 'failure' || steps.tests2.outcome == 'failure'
        run: |
          set -o pipefail
          sudo -n true 2>&1 && echo 'sudo: OK' || echo 'sudo: UNAVAILABLE'
          echo '--- memory / disk ---'
          free -h || true
          df -h / /tmp 2>&1 | head -6 || true
          echo '--- kernel OOM lines (dmesg) ---'
          sudo -n dmesg 2>&1 | grep -aiE 'oom|killed process' | tail -20 || echo '(no matching dmesg lines)'
          echo '--- kernel tail (unfiltered) ---'
          sudo -n dmesg 2>&1 | tail -6 || true
          echo '--- system journal: oom/docker/memory warnings ---'
          sudo -n journalctl -b -p warning --no-pager 2>&1 | grep -aiE 'oom|kill|docker|memory' | tail -20 || echo '(no matching journal lines)'
          echo '--- systemd-oomd log ---'
          sudo -n journalctl -b -u systemd-oomd --no-pager 2>&1 | tail -10 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.testMode }}
          path: test-results/${{ matrix.testMode }}

  build:
    name: build macOS player
    runs-on: ubuntu-24.04
    needs: [unity-version, test]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ needs.unity-version.outputs.version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ needs.unity-version.outputs.version }}-
      # OOM flake net: shared runners occasionally SIGKILL (137) the
      # parallel compile spike. Attempt 2 runs only if 1 fails and reuses
      # its warm workspace; genuine breaks fail twice and loudly below.
      - uses: game-ci/unity-builder@v6
        id: build1
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.unity-version.outputs.version }}
          targetPlatform: StandaloneOSX
          buildName: AxePath
          buildsPath: build
      # A killed attempt can leave untracked byproducts (seen once:
      # an empty Assets/Editor/Editor/ dir) that trip the builder's
      # clean-tree pre-check. Scrub the source trees — ignored paths
      # (Library, build) keep their warm state for attempt 2.
      - name: Clean worktree dirt left by a failed attempt
        id: cleanup
        if: steps.build1.outcome == 'failure'
        run: |
          echo '--- pre-cleanup status ---'
          git status --porcelain
          git checkout -- .
          git clean -fdq -- Assets/ Packages/ ProjectSettings/ || {
            echo 'retrying with sudo (the builder runs as root in docker)';
            sudo git clean -fdq -- Assets/ Packages/ ProjectSettings/;
          }
          echo '--- post-cleanup status ---'
          git status --porcelain
      - uses: game-ci/unity-builder@v6
        id: build2
        if: steps.build1.outcome == 'failure' && steps.cleanup.outcome == 'success'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.unity-version.outputs.version }}
          targetPlatform: StandaloneOSX
          buildName: AxePath
          buildsPath: build
      # Same evidence collector as the test job (see runbook and the comment
      # there). failure() defeats the implicit success() gate.
      - name: Capture OOM diagnostics on failure
        if: failure() || steps.build1.outcome == 'failure' || steps.build2.outcome == 'failure'
        run: |
          set -o pipefail
          sudo -n true 2>&1 && echo 'sudo: OK' || echo 'sudo: UNAVAILABLE'
          echo '--- memory / disk ---'
          free -h || true
          df -h / /tmp 2>&1 | head -6 || true
          echo '--- kernel OOM lines (dmesg) ---'
          sudo -n dmesg 2>&1 | grep -aiE 'oom|killed process' | tail -20 || echo '(no matching dmesg lines)'
          echo '--- kernel tail (unfiltered) ---'
          sudo -n dmesg 2>&1 | tail -6 || true
          echo '--- system journal: oom/docker/memory warnings ---'
          sudo -n journalctl -b -p warning --no-pager 2>&1 | grep -aiE 'oom|kill|docker|memory' | tail -20 || echo '(no matching journal lines)'
          echo '--- systemd-oomd log ---'
          sudo -n journalctl -b -u systemd-oomd --no-pager 2>&1 | tail -10 || true
      - uses: actions/upload-artifact@v7
        with:
          name: AxePath-macOS
          path: build/StandaloneOSX
