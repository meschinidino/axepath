# Axe Path releases: tag vX.Y.Z (matching VERSION) to build the
# macOS and Windows players and attach them to a GitHub Release.
#
# Cut a release:
#   1. CHANGELOG entry under [Unreleased], then rename it to [X.Y.Z].
#   2. Echo the version into VERSION, commit, merge to main.
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# 137 runbook: same story as CI (see the runbook comment in ci.yml) — exit
# code 137 is the editor SIGKILLed seconds after launch, fleet flakiness,
# never this repo. Rerun failed jobs. The diagnostics step below captures
# evidence on the Linux leg (137 is a Unix phenomenon; the probes are
# Linux-only, so the Windows leg skips it).
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: build ${{ matrix.targetPlatform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS player: Linux host cross-compile (proven path).
          - targetPlatform: StandaloneOSX
            os: ubuntu-24.04
            zipName: AxePath-macOS.zip
          # Windows player: needs a Windows host when the project
          # uses IL2CPP (MSVC toolchain); works for Mono too.
          - targetPlatform: StandaloneWindows64
            os: windows-latest
            zipName: AxePath-Windows.zip
    steps:
      - uses: actions/checkout@v7
      # Strip \r too: Windows runners check out text files with CRLF.
      - name: Tag must match VERSION
        shell: bash
        run: |
          test "v$(tr -d ' \r\n' < VERSION)" = "${{ github.ref_name }}" \
            || { echo "tag ${{ github.ref_name }} != v$(cat VERSION)"; exit 1; }
      - id: unity
        shell: bash
        run: echo "version=$(grep '^m_EditorVersion:' ProjectSettings/ProjectVersion.txt | cut -d' ' -f2 | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ steps.unity.outputs.version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-${{ steps.unity.outputs.version }}-
      # Same OOM flake net as CI: attempt 2 reuses attempt 1's warm
      # workspace; genuine breaks fail twice and loudly below.
      - uses: game-ci/unity-builder@v6
        id: build1
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.unity.outputs.version }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: AxePath
          buildsPath: build
      # A killed attempt can leave untracked byproducts (seen once:
      # an empty Assets/Editor/Editor/ dir) that trip the builder's
      # clean-tree pre-check. Scrub the source trees — ignored paths
      # (Library, build) keep their warm state for attempt 2.
      - name: Clean worktree dirt left by a failed attempt
        id: cleanup
        if: steps.build1.outcome == 'failure'
        shell: bash
        run: |
          echo '--- pre-cleanup status ---'
          git status --porcelain
          git checkout -- .
          git clean -fdq -- Assets/ Packages/ ProjectSettings/ || {
            echo 'retrying with sudo (the builder runs as root in docker)';
            sudo git clean -fdq -- Assets/ Packages/ ProjectSettings/;
          }
          echo '--- post-cleanup status ---'
          git status --porcelain
      - uses: game-ci/unity-builder@v6
        id: build2
        if: steps.build1.outcome == 'failure' && steps.cleanup.outcome == 'success'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.unity.outputs.version }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: AxePath
          buildsPath: build
      # Same 137 evidence collector as CI (see the runbook comments in
      # ci.yml). Ubuntu leg only: the probes are Linux-only and 137 is a
      # Unix phenomenon. failure() defeats the implicit success() gate (see
      # ci.yml); the old "Fail the job..." step was dead for the same reason
      # and is gone.
      - name: Capture OOM diagnostics on failure
        if: matrix.os == 'ubuntu-24.04' && (failure() || steps.build1.outcome == 'failure' || steps.build2.outcome == 'failure')
        shell: bash
        run: |
          set -o pipefail
          sudo -n true 2>&1 && echo 'sudo: OK' || echo 'sudo: UNAVAILABLE'
          echo '--- memory / disk ---'
          free -h || true
          df -h / /tmp 2>&1 | head -6 || true
          echo '--- kernel OOM lines (dmesg) ---'
          sudo -n dmesg 2>&1 | grep -aiE 'oom|killed process' | tail -20 || echo '(no matching dmesg lines)'
          echo '--- kernel tail (unfiltered) ---'
          sudo -n dmesg 2>&1 | tail -6 || true
          echo '--- system journal: oom/docker/memory warnings ---'
          sudo -n journalctl -b -p warning --no-pager 2>&1 | grep -aiE 'oom|kill|docker|memory' | tail -20 || echo '(no matching journal lines)'
          echo '--- systemd-oomd log ---'
          sudo -n journalctl -b -u systemd-oomd --no-pager 2>&1 | tail -10 || true
      - name: Zip the macOS .app
        if: matrix.targetPlatform == 'StandaloneOSX'
        shell: bash
        run: cd build/StandaloneOSX && zip -r -y ../../AxePath-macOS.zip AxePath.app
      - name: Zip the Windows player
        if: matrix.targetPlatform == 'StandaloneWindows64'
        shell: pwsh
        run: Compress-Archive -Path build/StandaloneWindows64/* -DestinationPath AxePath-Windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: player-${{ matrix.targetPlatform }}
          path: ${{ matrix.zipName }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/AxePath-*.zip
          body_path: INSTALL.md
          generate_release_notes: true
